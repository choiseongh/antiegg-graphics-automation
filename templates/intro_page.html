<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* 프레임: 1080 × 1350, 배경 #DFE3F0 */
  body {
    width: 1080px;
    height: 1350px;
    font-family: 'SUIT Variable', 'SUIT', sans-serif;
    background: #DFE3F0 url('file://{{ assets_dir }}/bg-intro.png') no-repeat center/cover;
    overflow: hidden;
    position: relative;
  }

  /* grain: 1080×1350 원본 크기 그대로 배치 */
  .grain {
    position: absolute;
    top: 0; left: 0;
    width: 1080px;
    height: 1350px;
    pointer-events: none;
    z-index: 1;
  }
  .grain img {
    width: 1080px;
    height: 1350px;
  }

  /* 발췌문1 프레임: 텍스트 영역 최대 높이 960px
     bottom-contents와 155px 간격 확보 */
  .body-area {
    position: absolute;
    top: 70px;
    left: 70px;
    width: 940px;
    max-height: 960px;
    overflow: hidden;
    z-index: 2;
  }

  /* 본문 텍스트: SUIT 56px 400w, lh:175%, ls:-1.12px
     overflow:hidden + text-overflow:ellipsis (truncation) */
  .body-text {
    width: 100%;
    max-height: 960px;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 9;
    color: #17181A;
    font-size: 56px;
    font-weight: 400;
    font-style: normal;
    line-height: 175%;
    letter-spacing: -1.12px;
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  /* 단락 간격: line-height 175% + 추가 24px */
  .body-text p {
    margin-bottom: 24px;
  }
  .body-text p:last-child {
    margin-bottom: 0;
  }

  /* Bottom Contents: Figma 900×55, display:flex,
     align-items:flex-start, gap:40px */
  .bottom-contents {
    position: absolute;
    bottom: 65px;
    left: 90px;
    width: 900px;
    height: 55px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 40px;
    z-index: 2;
  }

  /* footer title: Figma flex:1 0 0, SUIT 30px 500w,
     color:#17181A, letter-spacing:-0.9px */
  .footer-title {
    flex: 1 0 0;
    color: #17181A;
    font-size: 30px;
    font-weight: 400;
    font-style: normal;
    line-height: 37px;
    letter-spacing: -0.6px;
  }

  /* logo: 60 × 63.27, fill:#17181A */
  .logo {
    width: 60px;
    height: 63.27px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="grain"><img src="file://{{ assets_dir }}/grain-intro.png" alt=""></div>

  <div class="body-area">
    <div class="body-text">
      {% for paragraph in intro_paragraphs %}
      <p>{{ paragraph }}</p>
      {% endfor %}
    </div>
  </div>

  <div class="bottom-contents">
    <div class="footer-title">{{ article_title }}</div>
    <img class="logo" src="file://{{ assets_dir }}/logo-black.svg" alt="">
  </div>
</body>
</html>
