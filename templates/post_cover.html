<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://cdn.jsdelivr.net/gh/sun-typeface/SUIT/fonts/variable/woff2/SUIT-Variable.css');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1350px;
    font-family: 'SUIT Variable', 'SUIT', sans-serif;
    background: #000;
    overflow: hidden;
    position: relative;
  }

  .hero-image {
    position: absolute;
    top: 0; left: 0;
    width: 1080px;
    height: 1350px;
    object-fit: cover;
    object-position: center;
  }
  .hero-image.grayscale { filter: grayscale(100%); }

  /* 하단 그래디언트: 40%→투명, 100%→검정 */
  .dim-bottom {
    position: absolute;
    top: 0; left: 0;
    width: 1080px;
    height: 1350px;
    background: linear-gradient(
      180deg,
      rgba(0, 0, 0, 0) 40%,
      rgba(0, 0, 0, 1) 100%
    );
  }

  /* 상단 그래디언트: 상단 어두움 (하단 dim과 동일 비율, 방향 반대) */
  .dim-top {
    position: absolute;
    top: 0; left: 0;
    width: 1080px;
    height: 1350px;
    background: linear-gradient(
      0deg,
      rgba(0, 0, 0, 0) 32%,
      rgba(0, 0, 0, 1) 100%
    );
  }

  /* 상단 라벨 영역 */
  .top {
    position: absolute;
    top: 65px;
    left: 90px;
    width: 900px;
    height: 50px;
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .label {
    color: #FFF;
    font-size: 30px;
    font-weight: 800;
    line-height: normal;
    text-shadow: 1px 1px 15px rgba(0, 0, 0, 0.5);
  }

  /* 메인 타이틀 — 900×800, gap:40px */
  .main-title {
    position: absolute;
    left: 90px;
    width: 900px;
    height: 800px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 40px;
  }
  .main-title.pos-bottom {
    top: 265px;
    justify-content: flex-end;
  }
  .main-title.pos-top {
    top: 265px;
    justify-content: flex-start;
  }

  .title {
    align-self: stretch;
    color: #FFF;
    font-size: 80px;
    font-weight: 750;
    line-height: 145%;
    letter-spacing: -1.6px;
    text-shadow: 3px 10px 40px rgba(0, 0, 0, 0.4);
  }

  /* 에디터 */
  .editor-row {
    width: 900px;
    height: 50px;
    display: flex;
    align-items: center;
    gap: 14px;
    align-self: stretch;
  }

  .editor-label, .editor-divider, .editor-name {
    color: #FFF;
    font-size: 32px;
    font-style: normal;
    line-height: normal;
  }
  .editor-label { font-weight: 500; }
  .editor-divider { font-weight: 300; opacity: 0.5; }
  .editor-name { font-weight: 500; }

  /* 하단 콘텐츠 */
  .bottom-contents {
    position: absolute;
    bottom: 65px;
    left: 90px;
    width: 900px;
    height: 55px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 40px;
  }

  .logo {
    width: 60px;
    height: 63.27px;
  }
</style>
</head>
<body>
  <img class="hero-image {{ 'grayscale' if type == 'gray' }}" src="{{ hero_image }}" alt="">
  {% if title_position == 'top' %}
  <div class="dim-top"></div>
  {% else %}
  <div class="dim-bottom"></div>
  {% endif %}

  <div class="top">
    <div class="label">{{ type_label }}</div>
  </div>

  <div class="main-title {{ 'pos-top' if title_position == 'top' else 'pos-bottom' }}">
    <div class="title">{{ title_2line }}</div>
    <div class="editor-row">
      <span class="editor-label">에디터</span>
      <span class="editor-divider">|</span>
      <span class="editor-name">{{ editor }}</span>
    </div>
  </div>

  <div class="bottom-contents">
    <img class="logo" src="file://{{ assets_dir }}/logo-white.svg" alt="">
  </div>
</body>
</html>
